<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Match & Earn</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; }
        .hidden { display: none !important; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .form-control { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
        .btn-primary { padding: 10px 15px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { background: #0ea5e9; }
        
        /* Login Box */
        #adminLoginScreen { max-width: 400px; margin: 100px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
    </style>
</head>
<body>

    <!-- Admin Login Screen -->
    <div id="adminLoginScreen">
        <h2 style="color: #38bdf8; margin-bottom: 20px;">Admin Login Panel</h2>
        <div style="text-align: left;" class="form-group">
            <label style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px;">Admin Password</label>
            <input type="password" id="adminPassInput" class="form-control" placeholder="Enter password">
        </div>
        <button class="btn-primary" style="width: 100%;" onclick="verifyAdminLogin()">Login Dashboard</button>
    </div>

    <!-- Admin Dashboard Main -->
    <div id="adminDashboardMain" class="hidden container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: #38bdf8;">Admin Control Dashboard</h2>
            <button onclick="location.reload()" style="background: #ef4444; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Logout</button>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
            <button class="btn-primary" style="flex: 1;" onclick="switchAdminTab('users')">Manage Users</button>
            <button class="btn-primary" style="flex: 1;" onclick="switchAdminTab('requests')">Transactions & Requests</button>
            <button class="btn-primary" style="flex: 1;" onclick="switchAdminTab('chats')">Support Chats</button>
        </div>

        <div class="card">
            <div id="adminContentArea" style="font-size: 13px; color: #94a3b8;">Select a tab above to manage data.</div>
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDGu1r9uSKymwTH_5nQIwW8qKC9TYCrPow",
            authDomain: "votingbattle.firebaseapp.com",
            databaseURL: "https://votingbattle-default-rtdb.firebaseio.com",
            projectId: "votingbattle",
            storageBucket: "votingbattle.firebasestorage.app",
            messagingSenderId: "572901936550",
            appId: "1:572901936550:web:a3918de85c585d51975367"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function verifyAdminLogin() {
            const pass = document.getElementById('adminPassInput').value;
            if(pass === 'ali100') {
                document.getElementById('adminLoginScreen').classList.add('hidden');
                document.getElementById('adminDashboardMain').classList.remove('hidden');
                switchAdminTab('users');
            } else {
                alert('Incorrect Admin Password!');
            }
        }

        function switchAdminTab(tab) {
            let area = document.getElementById('adminContentArea');
            area.innerHTML = 'Loading...';

            if(tab === 'users') {
                db.ref('users').once('value', snap => {
                    area.innerHTML = '<h3 style="color:#38bdf8; margin-bottom:15px;">Registered Users</h3>';
                    if(!snap.exists()) { area.innerHTML += 'No users found.'; return; }
                    snap.forEach(child => {
                        let u = child.val();
                        let uid = child.key;
                        area.innerHTML += `
                            <div style="background:#0f172a; padding:12px; border-radius:8px; margin-bottom:10px; border:1px solid #334155;">
                                <p><b>${u.name}</b> (${u.email}) - ID: ${u.userId}</p>
                                <p>Balance: PKR ${u.balance} | Status: <b style="color:${u.status==='active'?'#10b981':'#ef4444'}">${u.status}</b></p>
                                <button onclick="toggleUserStatus('${uid}', '${u.status}')" style="margin-top:8px; background:${u.status==='active'?'#ef4444':'#10b981'}; border:none; color:white; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold;">${u.status==='active'?'Suspend Account':'Activate Account'}</button>
                            </div>
                        `;
                    });
                });
            } else if(tab === 'requests') {
                db.ref('transactions').once('value', snap => {
                    area.innerHTML = '<h3 style="color:#38bdf8; margin-bottom:15px;">Deposit & Withdrawal Requests</h3>';
                    if(!snap.exists()) { area.innerHTML += 'No requests found.'; return; }
                    snap.forEach(child => {
                        let t = child.val();
                        let tid = child.key;
                        area.innerHTML += `
                            <div style="background:#0f172a; padding:12px; border-radius:8px; margin-bottom:10px; border:1px solid #334155;">
                                <p>User: <b>${t.userName}</b> | Type: <b style="color:#38bdf8">${t.type.toUpperCase()}</b></p>
                                <p>Amount: PKR ${t.amount} via <b>${t.method}</b></p>
                                <p>Account Details: ${t.account}</p>
                                <p>Status: <span style="color:#eab308; font-weight:bold;">${t.status}</span></p>
                                ${t.status === 'pending' ? `
                                    <div style="margin-top:8px;">
                                        <button onclick="processTx('${tid}', '${t.userId}', '${t.type}',${t.amount}, 'approved')" style="background:#10b981; border:none; color:white; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; margin-right:8px;">Approve</button>
                                        <button onclick="processTx('${tid}', '${t.userId}', '${t.type}',${t.amount}, 'rejected')" style="background:#ef4444; border:none; color:white; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold;">Reject</button>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                });
            } else if(tab === 'chats') {
                db.ref('chats').once('value', snap => {
                    area.innerHTML = '<h3 style="color:#38bdf8; margin-bottom:15px;">User Support Chats</h3>';
                    if(!snap.exists()) { area.innerHTML += 'No chat messages found.'; return; }
                    snap.forEach(child => {
                        let uid = child.key;
                        area.innerHTML += `
                            <div style="background:#0f172a; padding:12px; border-radius:8px; margin-bottom:10px; border:1px solid #334155;">
                                <p style="margin-bottom:8px;">User Unique ID: <b>${uid}</b></p>
                                <div style="max-height:120px; overflow-y:auto; background:#1e293b; padding:8px; border-radius:6px; margin-bottom:8px;">
                        `;
                        let chatSnap = child.val();
                        Object.keys(chatSnap).forEach(msgKey => {
                            let m = chatSnap[msgKey];
                            area.innerHTML += `<p style="font-size:12px; margin-bottom:4px;"><b>${m.sender}:</b> ${m.message}</p>`;
                        });
                        area.innerHTML += `
                                </div>
                                <input type="text" id="adminReply_${uid}" placeholder="Type reply to user..." class="form-control">
                                <button onclick="sendAdminReply('${uid}')" class="btn-primary" style="padding:6px 12px; font-size:12px;">Send Reply</button>
                            </div>
                        `;
                    });
                });
            }
        }

        function toggleUserStatus(uid, currentStatus) {
            let newStatus = currentStatus === 'active' ? 'suspended' : 'active';
            db.ref('users/' + uid).update({ status: newStatus }).then(() => {
                alert("User status updated successfully!");
                switchAdminTab('users');
            });
        }

        function processTx(tid, userId, type, amount, status) {
            db.ref('transactions/' + tid).update({ status: status }).then(() => {
                if(status === 'approved') {
                    db.ref('users/' + userId).once('value', snap => {
                        let uBal = snap.val().balance || 0;
                        let newBal = type === 'deposit' ? uBal + amount : uBal - amount;
                        db.ref('users/' + userId).update({ balance: newBal });
                    });
                }
                alert("Transaction " + status + "!");
                switchAdminTab('requests');
            });
        }

        function sendAdminReply(uid) {
            const replyText = document.getElementById('adminReply_' + uid).value;
            if(!replyText) return;

            db.ref('chats/' + uid).push({
                sender: 'admin',
                message: replyText,
                seen: false,
                timestamp: Date.now()
            }).then(() => {
                alert("Reply sent to user!");
                switchAdminTab('chats');
            });
        }
    </script>
</body>
</html>
